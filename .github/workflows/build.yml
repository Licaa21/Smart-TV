name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  # ───────────────────────────────────────────────
  # webOS IPK
  # ───────────────────────────────────────────────
  build-webos:
    name: Build webOS
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.build.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci --force

      - name: Build webOS
        id: build
        run: npm run build:webos

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: webos
          path: |
            Moonfin_webOS_*.ipk
            packages/build-webos/org.moonfin.webos.manifest.json

  # ───────────────────────────────────────────────
  # Tizen WGTs (Regular, Oblong, Legacy)
  # ───────────────────────────────────────────────
  build-tizen:
    name: Build Tizen
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.build.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci --force

      - name: Build Tizen (all variants)
        id: build
        run: npm run build:tizen:all

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tizen
          path: Moonfin_Tizen_*.wgt

  # ───────────────────────────────────────────────
  # Vega web bundle and shell checks
  # ───────────────────────────────────────────────
  build-vega:
    name: Build Vega
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.build.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --force

      # The package itself needs the Vega SDK, which only Amazon's partners get in CI,
      # so this stops once the web bundle is in the shell.
      - name: Build Vega web bundle
        id: build
        run: node packages/build-vega/build.js --no-vpkg

      - name: Check the shell
        working-directory: packages/build-vega/shell
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm test

  # ───────────────────────────────────────────────
  # Jest suite
  # ───────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.jest.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci --force

      - name: Run tests
        id: jest
        run: npm test --workspace @moonfin/app

  # ───────────────────────────────────────────────
  # Save PR build outcomes for pr-comment workflow
  # ───────────────────────────────────────────────
  save-pr-results:
    name: Save PR Build Results
    # Without always() a failed build skips this job, no artifact is uploaded, and
    # the comment workflow has nothing to read, so the run that most needs a comment
    # is the one that never gets one.
    if: always() && github.event_name == 'pull_request'
    needs: [build-webos, build-tizen, build-vega, test]
    runs-on: ubuntu-latest
    steps:
      - name: Write outcomes.json
        run: |
          cat > outcomes.json <<EOF
          {
            "pr_number": ${{ github.event.pull_request.number }},
            "sha": "${{ github.event.pull_request.head.sha }}",
            "webos": "${{ needs.build-webos.outputs.result }}",
            "tizen": "${{ needs.build-tizen.outputs.result }}",
            "vega": "${{ needs.build-vega.outputs.result }}",
            "tests": "${{ needs.test.outputs.result }}"
          }
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: build-results
          path: outcomes.json

  # ───────────────────────────────────────────────
  # GitHub Draft Release (tags only)
  # ───────────────────────────────────────────────
  release:
    name: Create Draft Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-webos, build-tizen]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          # The webOS artifact keeps the manifest in its folder. The asset is still named after
          # the file, and it carries the hash of the package uploaded next to it.
          files: |
            Moonfin_webOS_*.ipk
            Moonfin_Tizen_*.wgt
            packages/build-webos/org.moonfin.webos.manifest.json
