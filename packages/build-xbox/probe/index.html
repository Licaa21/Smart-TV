<!doctype html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Moonfin probe</title>
	<style>
		html, body { margin: 0; background: #101418; color: #e6e6e6; font: 22px/1.4 sans-serif; }
		body { display: flex; height: 100vh; overflow: hidden; }
		#results { flex: 1; overflow-y: auto; padding: 24px 32px; }
		#side { width: 520px; border-left: 1px solid #333; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
		h1 { font-size: 28px; margin: 0 0 12px; }
		h2 { font-size: 24px; margin: 24px 0 8px; color: #8ab4f8; }
		#status { margin: 12px 0; padding: 12px 16px; border-radius: 6px; background: #1c2530; white-space: pre-wrap; }
		#status.done { background: #17321f; }
		#question button { display: block; margin: 8px 0; min-width: 520px; text-align: left; }
		.row { display: flex; gap: 16px; padding: 2px 0; }
		.row .name { width: 420px; flex-shrink: 0; color: #aaa; }
		.row .value { white-space: pre-wrap; word-break: break-all; }
		.ok { color: #7ee787; }
		.fail { color: #ff7b72; }
		.wait { color: #d2a8ff; }
		button { font: inherit; padding: 10px 16px; margin: 4px 8px 4px 0; background: #222; color: #eee; border: 2px solid #444; border-radius: 6px; }
		button:focus { border-color: #8ab4f8; outline: 4px solid #8ab4f8; background: #2a3340; color: #fff; }
		#keys, #events { flex: 1; overflow-y: auto; font-family: monospace; font-size: 18px; background: #0a0d10; padding: 8px; }
		video { width: 480px; height: 270px; background: #000; display: block; }
	</style>
	<script src="probe-config.js"></script>
	<script src="probe-script.js"></script>
</head>
<body>
	<div id="results">
		<h1 id="title">Moonfin probe</h1>
		<div id="actions"></div>
		<div id="question"></div>
		<div id="status">Press the first button to run every test and send the report. The checks below have already started on their own.</div>
		<div id="sections"></div>
	</div>
	<div id="side">
		<div>Keys (keyCode, key, code, repeat)</div>
		<div id="keys"></div>
		<div>Lifecycle and bridge events</div>
		<div id="events"></div>
	</div>
	<script src="probe.js"></script>
</body>
</html>
