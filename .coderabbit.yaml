# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
tone_instructions: >-
  Most contributors are volunteers. Be direct and friendly, explain why a change
  matters, and point to the existing code to follow. Use plain American English.

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  # The summary stays in the walkthrough comment. Writing it into the description
  # reruns the label workflow, which takes off any of its labels added by hand.
  high_level_summary_in_walkthrough: true
  in_progress_fortune: false
  # label-platform.yml owns the labels.
  suggested_labels: false
  auto_review:
    base_branches:
      - ".*"
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
  pre_merge_checks:
    docstrings:
      mode: "off"
  path_filters:
    - "!**/package-lock.json"
  path_instructions:
    - path: "packages/**"
      instructions: |
        Moonfin for Smart TVs is one Enact (React) app built for LG webOS, Samsung Tizen and Amazon Fire TV (Vega). packages/app is the shared app, packages/platform-* hold per platform code, and packages/build-* do the packaging.
        - The browser floor is Chrome 38 and Safari 7 (webOS 3 and Tizen 2.4), set in packages/app/.browserslistrc. core-js covers JS built-ins, but DOM APIs above that floor, like ResizeObserver or IntersectionObserver, need a fallback. Don't suggest newer browser APIs as a cleanup.
        - The build inlines every `var(--theme-*, fallback)` to its fallback, so CSS variables theme nothing on a TV. New themed UI adds rules in packages/app/src/theme/themeOverrides.js or uses inline styles from the active theme.
        - Overlays, dialogs and full screen layers have to hold focus with a shared holder from packages/app/src/utils/spotlightContainers.js, or with `leaveFor` set to '' on all four sides, or `spotlightRestrict="self-only"`. `restrict: 'self-only'` in a SpotlightContainerDecorator config does nothing, because the prop's default overwrites it. Rows, grids and tab bars have to let focus out.
        - App.js handles Back in a capture listener that stops the event, so a component's own onKeyDown Back handler never runs. Screens and overlays register their Back handling through backHandlerRef.
        - One unknown enum value or property in the device profile makes Jellyfin answer PlaybackInfo with a 400 for every video. New profile conditions, properties or enum values have to exist in Jellyfin 10.10, or be gated through packages/app/src/services/profileForServer.js.
        - The Auto max bitrate values in getAutoMaxBitrate come from LG's published AV format limits. Don't suggest raising them to match other clients.
        - webOS ignores object-fit on video, because the hardware plane fills the element's box. Size the element itself to get cover or contain.
        - On Fire TV (Vega), any backdrop-filter over a playing video turns the picture black. Player overlays drop their blur under the `.vega` class, and new overlays over video need the same rule.
        - On Fire TV (Vega), never put HEVC in a TS based HLS profile, since the WebView can't demux it. fMP4 carries HEVC. Keep a TS HLS entry too, or Jellyfin has nothing to send live TV.
        - Changes to which libraries exist or their order dispatch `moonfin:browseRefresh` with `{libraries: true}`, or Home keeps its cached rows for up to 30 minutes.
        - New UI strings use $L and go only in packages/app/resources/strings.json. The per locale strings.json files come from Weblate.
        - @enact/cli and @webos-tools/cli live in the git ignored tools/ prefix. Never add them to devDependencies.
        - EmulatorJS: do game state and gameManager work on the `start` event, not `ready`, since gameManager doesn't exist yet on ready. Treat startGameError as the failure signal, because `exit` doesn't fire for most failures. In page teardown has to clear the listeners, timers, script tag and joysticks EmulatorJS leaves behind.
        - Say Seerr, not Jellyseerr.
    - path: "**/*.less"
      instructions: |
        - Nothing polyfills CSS. A property or selector above the Chrome 38 and Safari 7 floor (flex gap, aspect-ratio, inset, :is, :where and similar) is dropped silently on older TVs. scripts/check-legacy-css.js holds a per file baseline that can only go down.
        - Old engines drop a whole grouped rule when one selector has a pseudo class they don't know, like :focus-within. Keep those selectors in their own rule.
        - Tizen and webOS paint in software raster, so focus effects are expensive. New focus box-shadows, blur, `transition: all`, and transitions on layout properties like width, max-width or padding need perf-low and perf-mid overrides, like the existing rules in packages/app/src/styles/perf-overrides.less.
  tools:
    eslint:
      # e18e suggests newer built-ins and dependency swaps that don't fit a
      # Chrome 38 floor.
      e18e:
        enabled: false

chat:
  art: false
